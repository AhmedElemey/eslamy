name: Build APK and email it

on:
  push:
    branches:
      - main

jobs:
  build-and-email:
    name: Build release APK and email it
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version and commit info
        id: apk
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          short_sha=$(git rev-parse --short "$GITHUB_SHA")
          name="eslamy-${version}-${short_sha}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${name}"
          echo "apk_name=${name}" >> "$GITHUB_OUTPUT"
          echo "apk_path=build/app/outputs/flutter-apk/${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Email the APK
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER_ADDRESS }}
          server_port: ${{ secrets.EMAIL_SERVER_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Eslamy APK build ${{ steps.apk.outputs.version }} (${{ github.sha }})"
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: Eslamy CI
          body: |
            A new release APK was built from a push to main.

            Version: ${{ steps.apk.outputs.version }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}

            The APK is attached to this email and also available as a workflow artifact:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: ${{ steps.apk.outputs.apk_path }}
